name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Create temp .env file
        run: |
          echo "MYSQL_ROOT_PASSWORD=rootsecret" > .env
          echo "MYSQL_DATABASE=appdb" >> .env
          echo "MYSQL_USER=appuser" >> .env
          echo "MYSQL_PASSWORD=secretpass" >> .env

      - name: Build and start Docker Compose stack
        run: docker compose up -d --build

      - name: Test API endpoints
        run: |
          sleep 15
          curl -f http://localhost:8080/
          curl -f http://localhost:8080/db-check

      - name: Stop stack
        if: always()
        run: docker compose down
